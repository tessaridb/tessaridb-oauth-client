[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["boogvar"]
repository = "https://github.com/tessaridb/tessaridb-oauth-client"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signature verification only: ECDSA P-256 and Ed25519, the two algorithms the issuer signs with.
ring = "0.17"
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# The key set is fetched over https, trusting the operating system's roots.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
